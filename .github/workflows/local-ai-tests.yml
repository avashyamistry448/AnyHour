name: Local AI regression tests

on:
  pull_request:
  push:
    branches:
      - feature/ollama-grounded-course-answers

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile server.py course_ai.py classpilot-v5/server.py classpilot-v5/course_ai.py
      - name: Test grading and retrieval
        run: python -m unittest discover -s tests -v
