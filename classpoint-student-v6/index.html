ing:26px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 85px #08112455}.note{padding:14px 16px;border-radius:10px;background:#f0f4ff;border:1px solid #e0e8ff;color:#586ea2;font-size:12px;line-height:1.6}.code-display{background:#f3f6ff;padding:25px;text-align:center;border-radius:14px;border:1px dashed #b2c4f6;font-size:27px;letter-spacing:2px;font-weight:850;color:#4f65d1}.meter{height:10px;background:#eff2fa;border-radius:10px;overflow:hidden;flex:1}.meter>div{height:100%;background:#657bf0;border-radius:10px}.barrow{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:12px}.barlabel{width:125px;color:#6c7a94}.toast{position:fixed;right:25px;bottom:24px;background:#172849;color:white;border-radius:10px;padding:14px 20px;box-shadow:0 12px 35px #0002;font-size:13px;z-index:20}.chat{min-height:550px;display:flex;flex-direction:column}.messages{flex:1;min-height:370px;max-height:490px;overflow:auto;display:flex;flex-direction:column;gap:13px;padding:14px 0}.bubble{align-self:flex-start;background:#f2f5fc;border-radius:14px;padding:13px 16px;max-width:82%;font-size:13px;line-height:1.6;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--blue);color:white}.source{font-size:11px;color:#5270d5;margin-top:9px;font-weight:750}.chatbar{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:15px}.chatbar input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px}.two-cols{display:grid;grid-template-columns:260px 1fr;gap:18px}.smallinfo{font-size:12px;color:#78879f}.inline-label{font-size:12px;font-weight:700;color:#667694}.badge-circle{border-radius:100%;padding:5px 9px;background:#f0f3ff;color:var(--blue);font-size:11px}.skeleton{padding:50px;text-align:center;color:var(--muted)}@media(max-width:1000px){.sidebar{width:73px;padding:23px 9px}.brand span:last-child,.nav .label,.side-label,.side-bottom{display:none}.brand{padding:0 9px}.nav button{justify-content:center}.content{padding:23px}.topbar{padding:0 23px}.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:630px){.sidebar{width:57px;padding:17px 5px}.topbar{padding:0 12px}.content{padding:18px 13px}.card{padding:15px}.intro{align-items:flex-start}.intro .btn{white-space:nowrap}.formgrid,.two-cols{grid-template-columns:1fr}.statvalue{font-size:24px}.code-display{font-size:20px}}

.week-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.day-card{min-height:160px;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--bg)}.day-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:12px}.time-chip{background:var(--lav);color:var(--ink);border-radius:9px;padding:8px 6px;margin-bottom:8px;font-size:11px;overflow-wrap:break-word}.time-chip strong{font-size:11px}.time-chip .muted{font-size:10px}html[data-theme=dark]{--bg:#101728;--ink:#e9efff;--muted:#abb9d4;--line:#34415d;--nav:#080f20;--lav:#283a64;--green:#66dabb;--shadow:0 8px 26px #0003;color-scheme:dark}html[data-theme=dark] .topbar,html[data-theme=dark] .card,html[data-theme=dark] .modal,html[data-theme=dark] .resource,html[data-theme=dark] .course-tile,html[data-theme=dark] .tab,html[data-theme=dark] .role,html[data-theme=dark] .btn.ghost{background:#1b263d;color:var(--ink);border-color:var(--line)}html[data-theme=dark] .field input,html[data-theme=dark] .field textarea,html[data-theme=dark] .field select,html[data-theme=dark] .course-select,html[data-theme=dark] .chatbar input{background:#141e31;border-color:#43506d;color:var(--ink)}html[data-theme=dark] .note,html[data-theme=dark] .bubble,html[data-theme=dark] .code-display,html[data-theme=dark] .stat-icon,html[data-theme=dark] .badge-circle{background:#263959;border-color:#385582;color:#cad9ff}html[data-theme=dark] .bubble.user,html[data-theme=dark] .tab.active{background:var(--blue);color:white}html[data-theme=dark] .tag,html[data-theme=dark] .btn.secondary{background:#2a3c67;color:#c6d5ff}html[data-theme=dark] .listrow{border-bottom-color:#35415c}html[data-theme=dark] .course-tile:hover,html[data-theme=dark] .course-tile.active{background:#263658}html[data-theme=dark] .resource p,html[data-theme=dark] .smallinfo{color:#aebbd2}html[data-theme=dark] .modalbg{background:#030817c7}html[data-theme=dark] .day-card{background:#151f34}html[data-theme=dark] .time-chip{background:#2d3e65 /* anyhour v5: fewer destinations, clearer hierarchies and usable scheduling */
.content{max-width:1240px}
.nav button{min-height:43px;transition:background .16s,color .16s}
.intro{margin-bottom:24px}.intro h1{font-size:30px}.intro p{max-width:570px}
.card{border-radius:17px}.btn{transition:transform .12s,filter .12s}
.btn:active,.mode-card:active{transform:translateY(1px)}
.hub-bar{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:23px;padding:12px 16px;background:var(--card-bg,#fff);border:1px solid var(--line);border-radius:14px}
.hub-label{font-weight:800;font-size:12px;color:var(--muted);letter-spacing:.3px}
.hub-switch{display:flex;gap:5px;padding:4px;border-radius:11px;background:var(--bg)}
.hub-tab{border:0;border-radius:9px;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:11px 15px;white-space:nowrap}
.hub-tab.active{background:var(--blue);color:white;box-shadow:0 3px 12px #516ce126}
.office-layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:18px;align-items:start}
.office-main,.office-side{min-width:0}.office-main>.sectionhead{align-items:flex-start}
.smallinfo{font-size:12px;color:var(--muted);margin:6px 0 14px}
.mode-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:21px 0 24px}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;min-height:135px;border:1px solid var(--line);padding:16px;border-radius:13px;background:var(--card-bg,#fff);color:var(--ink);transition:border-color .18s,background .18s}
.mode-card:hover{border-color:var(--blue)}.mode-card.active{border:2px solid var(--blue);background:var(--lav);padding:15px}
.mode-card strong{font-size:13px}.mode-card small{font-size:11px;color:var(--muted);line-height:1.5}.mode-icon{font-size:21px;color:var(--blue)}
.calendar-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 15px}
.calendar-header h2{font-size:16px}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.weekday{border:1px solid var(--line);border-radius:12px;background:var(--card-bg,#fff);display:flex;flex-direction:column;gap:10px;align-items:center;padding:16px 4px;min-width:0;color:var(--ink);font-size:11px}
.weekday strong{font-size:11px;color:var(--muted)}.weekday:hover{border-color:var(--blue)}.weekday.active{background:var(--lav);border-color:var(--blue)}.weekday.active span,.weekday.active strong{color:var(--blue)}
.day-agenda{margin-top:20px;border:1px solid var(--line);border-radius:13px;padding:17px 19px;min-height:182px}
.day-agenda h3{font-size:14px}
.appointment-row{display:flex;align-items:center;gap:15px;padding:14px 0;border-top:1px solid var(--line)}
.time-block{min-width:150px;font-size:12px;color:var(--blue);font-weight:800}.grow{flex:1;min-width:0}.appointment-row a{font-size:12px;color:var(--blue)}
.icon-remove{border:0;color:var(--muted);background:transparent;padding:8px 10px;border-radius:8px}.icon-remove:hover{background:var(--lav);color:var(--red)}
.empty-day{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:11px 10px}
.empty-day>span{font-size:27px;color:var(--muted)}.empty-day p{font-size:12px;margin:0 0 4px}
.appointment-hero{display:flex;gap:20px;align-items:start;border:1px solid var(--line);background:var(--bg);padding:25px;border-radius:14px;margin-bottom:16px}
.appoint-symbol{display:grid;place-items:center;background:var(--lav);color:var(--blue);border-radius:14px;font-size:25px;width:54px;min-width:54px;height:54px}
.appointment-hero h2{font-size:17px}.appointment-hero p{margin:9px 0}.appointment-hero a,.office-side a{color:var(--blue);font-weight:700;font-size:12px}
.source-header{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:15px}
.official-value{border:1px solid var(--line);background:var(--bg);padding:17px;font-weight:800;border-radius:11px;margin:17px 0}
.soft-divider{border-top:1px solid var(--line);margin:25px 0}
html[data-theme=dark]{--card-bg:#202e46}
html[data-theme=dark] .hub-bar,html[data-theme=dark] .mode-card,html[data-theme=dark] .weekday{background:#202e46}
html[data-theme=dark] .hub-switch,html[data-theme=dark] .appointment-hero,html[data-theme=dark] .official-value{background:#16233b}
html[data-theme=dark] .mode-card.active,html[data-theme=dark] .weekday.active{background:#273c64}
html[data-theme=dark] .mode-card small{color:#9fadc3}
html[data-theme=dark] .hub-tab.active{background:var(--blue);color:white}
@media(max-width:1020px){.office-layout{grid-template-columns:1fr}.office-side{order:2}}
@media(max-width:720px){.hub-bar{align-items:stretch;flex-direction:column}.hub-switch{overflow-x:auto}.hub-tab{flex:1}.office-layout{grid-template-columns:1fr}.week-strip{grid-template-columns:repeat(4,1fr)}.mode-picker{grid-template-columns:1fr}.appointment-row{flex-wrap:wrap}.time-block{min-width:unset}.content{padding:24px 17px}.intro{flex-direction:column;align-items:flex-start}}
